name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: five-rules
          path: build/libs/
      # Publishes the latest jar at a fixed public link:
      # https://github.com/<owner>/<repo>/releases/download/dev/five-rules.jar
      - name: Publish dev release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/libs/five-rules-*[0-9].jar five-rules.jar
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev five-rules.jar --prerelease --target "$GITHUB_SHA" \
            --title "5 RULES (latest test build)" \
            --notes "Latest build of branch ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Put five-rules.jar in your mods folder with Fabric API, Minecraft 1.21.1."
